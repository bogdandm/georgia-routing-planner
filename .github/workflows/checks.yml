name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify documentation-only changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="$PUSH_BEFORE_SHA"
          diff_range="$PUSH_BEFORE_SHA..$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            diff_range="$PR_BASE_SHA...$GITHUB_SHA"
          fi

          docs_only=false
          if [[ -n "$base_sha" && ! "$base_sha" =~ ^0+$ ]]; then
            changed_paths="$(git diff --name-only --diff-filter=ACDMRT "$diff_range")"
            if [[ -n "$changed_paths" ]]; then
              docs_only=true
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  *.md | docs/*) ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done <<< "$changed_paths"
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm repo:audit
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
        env:
          BASE_PATH: /
      - name: Build deployable Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm build:app
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload deployable Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  supabase-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:database:test

  supabase-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:functions:check
      - run: pnpm supabase:functions:test

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6]
        shardTotal: [6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run:
          pnpm test:coverage --reporter=blob --shard=${{ matrix.shardIndex }}/${{
          matrix.shardTotal }}
        env:
          VITEST_COVERAGE_SHARD: 'true'
      - name: Upload Vitest shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results-${{ matrix.shardIndex }}
          path: .vitest-reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: vitest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Vitest shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-results-*
          path: .vitest-reports
          merge-multiple: true
      - run:
          pnpm exec vitest run --config vitest.coverage.config.ts --merge-reports
          --coverage

  e2e:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for end-to-end tests
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end test shard
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Skip end-to-end tests for documentation-only changes
        if: needs.changes.outputs.docs_only == 'true'
        run:
          echo "Skipping Playwright because every changed path is documentation-only."
      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs:
      - changes
      - quality
      - supabase-database
      - supabase-functions
      - vitest
      - coverage
      - e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification dependency to pass or skip
        shell: bash
        env:
          NEEDS: ${{ toJson(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
